[package]
name = "ahutong-sdk"
version = "0.1.0"
edition = "2024"

[lib]
name = "ahutong_rs"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
url = "2.4"
bytes = "1"
regex = "1.12.2"
urlencoding = "2.1.3"
reqwest_cookie_store = "0.9.0"
cookie_store = "0.22.0"
jni = "0.21.1"
android_logger = "0.13"
log = "0.4"