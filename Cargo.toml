[package]
name = "ahutong-sdk"
version = "0.1.0"
edition = "2024"

[lib]
name = "ahutong_rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
url = "2.4"
bytes = "1"
regex = "1.12.2"
urlencoding = "2.1.3"
sha2 = "0.10.9"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
base64 = "0.22.1"
guixu = { path = "../GuiXu-Rust" }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest_cookie_store = "0.9.0"
cookie_store = "0.22.0"
jni = "0.21.1"
android_logger = "0.13"
env_logger = "0.11"
axum = { version = "0.7", optional = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"], optional = true }
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart"] }
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
tokio = { version = "1", features = ["sync"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3.69"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[features]
default = []
server = ["axum", "tower-http"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
